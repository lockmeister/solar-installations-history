name: Update solar installation data

on:
  schedule:
    # Weekly, Sunday 21:30 UTC = Monday morning NZ time (09:30 NZST / 10:30 NZDT)
    - cron: '30 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch datasets
        run: python scripts/fetch_solar_installations.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current data/snapshots metadata/manifest.jsonl
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update solar installation datasets"
            git push
          fi
